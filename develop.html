<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

  <script>
    async function transferMoney() {
      const amount = document.getElementById('amount').value;
      const fromNetwork = document.getElementById('fromNetwork').value;
      const toNetwork = document.getElementById('toNetwork').value;
      const senderNumber = document.getElementById('senderNumber').value;
      const recipientNumber = document.getElementById('recipientNumber').value;
      const resultDiv = document.getElementById('result');

      if (!amount || !fromNetwork || !toNetwork || !senderNumber || !recipientNumber || fromNetwork === toNetwork) {
        resultDiv.innerHTML = 'Veuillez remplir tous les champs et choisir des réseaux différents.';
        resultDiv.className = 'error';
        return;
      }

      resultDiv.innerHTML = 'Traitement en cours <i class="fas fa-spinner fa-spin"></i>';
      resultDiv.className = 'loading';

      try {
        const response = await simulateTransfer(fromNetwork, toNetwork, amount, senderNumber, recipientNumber);
        resultDiv.innerHTML = `Transfert de ${amount} XOF de ${fromNetwork.toUpperCase()} (émetteur: ${senderNumber}) vers ${toNetwork.toUpperCase()} (destinataire: ${recipientNumber}) réussi. Aucun frais appliqué. <i class="fas fa-check-circle"></i>`;
        resultDiv.className = 'success';
      } catch (error) {
        resultDiv.innerHTML = `Erreur : ${error.message} <i class="fas fa-exclamation-triangle"></i>`;
        resultDiv.className = 'error';
      }
    }

    function simulateTransfer(from, to, amount, sender, recipient) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (amount <= 0) {
            reject(new Error('Montant invalide.'));
          } else if (!/^\+?[0-9]{10,12}$/.test(sender) || !/^\+?[0-9]{10,12}$/.test(recipient)) {
            reject(new Error('Numéros de téléphone invalides.'));
          } else {
            resolve(`Transaction simulée de ${amount} XOF.`);
          }
        }, 1500);
      });
    }
  </script>
